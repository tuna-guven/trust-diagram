version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised version is likely
    # to be found and pulled before it reaches this project.
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised version is likely
    # to be found and pulled before it reaches this project.
    cooldown:
      default-days: 7
